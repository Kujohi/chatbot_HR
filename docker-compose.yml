services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr_bot_backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr_bot_frontend
    expose:
      - "3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_BACKEND_URL=/api
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: hr_bot_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
