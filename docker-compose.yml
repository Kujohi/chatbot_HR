services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr_bot_postgres
    environment:
      POSTGRES_DB: menas_hr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr_bot_backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/menas_hr_db
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr_bot_frontend
    expose:
      - "3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_BACKEND_URL=/api
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: hr_bot_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "3001:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

volumes:
  postgres_data:
