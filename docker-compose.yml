version: '3.11-slim'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr_bot_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr_bot_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    restart: always
